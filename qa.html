<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>825 简答 · 论述 · 矿山压力与岩层控制</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d212b; --line:#262b38;
    --text:#e9ecf3; --dim:#8a92a6; --faint:#5d6579;
    --amber:#e0a458; --green:#5fb47a; --red:#e06c6c; --blue:#6aa6e0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.7;
    padding:0 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:680px;margin:0 auto;padding:16px 16px 40px;}
  a{color:var(--amber);text-decoration:none;}
  .muted{color:var(--dim);} .faint{color:var(--faint);}

  header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .back{font-size:13px;color:var(--dim);}
  .eyebrow{font-size:12px;letter-spacing:.1em;color:var(--faint);margin-left:auto;}
  h1{font-size:19px;margin:0 0 4px;letter-spacing:.02em;}
  .prog-bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;}
  .prog-bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .25s;}
  .prog-txt{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:5px;}

  .tools{display:flex;gap:8px;margin-bottom:10px;}
  .search{
    flex:1;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:9px 12px;font-size:14px;color-scheme:dark;
  }
  .search:focus{outline:none;border-color:var(--amber);}
  .btn{
    background:var(--card2);border:1px solid var(--line);color:var(--dim);
    border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .btn:active{transform:scale(.98);}
  .btn.on{color:var(--amber);border-color:rgba(224,164,88,.5);background:rgba(224,164,88,.12);}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    background:var(--card2);border:1px solid var(--line);color:var(--dim);
    border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer;
  }
  .chip.on{background:rgba(224,164,88,.14);border-color:rgba(224,164,88,.5);color:var(--amber);}

  h2.ch{
    font-size:13px;font-weight:600;color:var(--dim);
    letter-spacing:.04em;margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line);
  }
  h2.ch:first-of-type{border-top:0;padding-top:0;margin-top:4px;}

  .qa{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin-bottom:9px;overflow:hidden;
  }
  .qa.done{border-color:rgba(95,180,122,.35);}
  .qa-head{
    display:flex;align-items:flex-start;gap:9px;padding:12px 13px;cursor:pointer;
  }
  .qa-idx{
    min-width:22px;height:22px;border-radius:6px;background:var(--card2);
    color:var(--faint);font-size:11.5px;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;margin-top:2px;
  }
  .qa.done .qa-idx{background:rgba(95,180,122,.16);color:var(--green);}
  .qa-tt{flex:1;font-size:15px;font-weight:600;line-height:1.5;}
  .qa-arrow{color:var(--faint);font-size:12px;margin-top:3px;transition:transform .2s;}
  .qa.open .qa-arrow{transform:rotate(90deg);}
  .qa-body{display:none;padding:0 13px 13px;}
  .qa.open .qa-body{display:block;}
  .qa-q{
    font-size:13.5px;color:var(--dim);border-left:2px solid var(--line);
    padding-left:9px;margin:0 0 10px;
  }
  .qa-body ol{margin:0;padding-left:19px;}
  .qa-body li{margin-bottom:7px;font-size:14px;line-height:1.72;}
  .qa-tip{
    margin-top:10px;font-size:13px;color:var(--amber);
    background:rgba(224,164,88,.08);border-radius:8px;padding:7px 10px;line-height:1.6;
  }
  .qa-tip b{font-weight:600;color:var(--amber);}
  .mk{
    margin-top:11px;display:inline-block;font-size:12.5px;color:var(--dim);
    border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;
  }
  .mk:hover{color:var(--green);border-color:rgba(95,180,122,.5);}
  .qa.done .mk{color:var(--green);border-color:rgba(95,180,122,.4);background:rgba(95,180,122,.08);}

  .fig{
    background:#f6f6f2;border:1px solid var(--line);border-radius:10px;
    padding:8px 8px 2px;margin:10px 0 12px;
  }
  .fig img{display:block;width:100%;height:auto;border-radius:6px;cursor:zoom-in;}
  .fig .cap{text-align:center;font-size:11.5px;color:#6f7789;padding:6px 0 6px;}
  #zoom{
    position:fixed;inset:0;background:rgba(8,10,14,.94);z-index:80;display:none;
    align-items:center;justify-content:center;padding:10px;cursor:zoom-out;
  }
  #zoom.show{display:flex;}
  #zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:4px;}

  .empty{text-align:center;color:var(--faint);padding:40px 0;font-size:13.5px;}
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--line);color:var(--text);
    padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;
    transition:all .22s;z-index:30;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row">
      <a class="back" href="index.html">← 返回</a> <a class="back" href="terms.html" style="color:var(--blue);margin-left:10px">名词手册 →</a> <a class="back" href="pro.html" style="color:var(--amber);margin-left:10px">刷题 →</a>
      <span class="eyebrow">825 · 必考简答题</span>
    </div>
    <h1>简答 · 论述</h1>
    <div class="muted" style="font-size:13px;margin-bottom:10px;">按资料章序整理，配图为手绘示意图</div>
    <div class="prog-bar"><i id="progFill"></i></div>
    <div class="prog-txt"><span id="progTxt">0 / 0</span><span>背过一题点一次</span></div>
  </header>

  <div class="tools">
    <input class="search" id="search" placeholder="搜题干、关键词…">
    <button class="btn" id="btnOpen">全展开</button>
  </div>

  <div class="filters" id="filters"></div>
  <div id="list"></div>
</div>
<div id="toast"></div>
<div id="zoom"><img id="zoomImg" alt=""></div>

<script src="sync.js"></script>
<script src="qa-data.js"></script>
<script>
(function(){
  var KEY = "kaoyan-825-qa-v1";
  var CH_NAMES = {
    1:"矿山岩石和岩体的基本性质", 2:"原岩应力及其重新分布", 3:"采场顶板活动规律",
    4:"采场矿山压力显现基本规律", 5:"采场顶板控制及支护方法", 6:"采区巷道矿压显现与控制",
    7:"煤矿冲击地压现象与防治", 8:"采场岩层移动与控制", 9:"矿山压力与岩层控制的研究方法"
  };
  var QA = (window.QA || []).map(function(q, i){ q.idx = i; return q; });
  var state = { done: {}, ts: 0 };
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var s = JSON.parse(raw) || {};
      // 旧格式直接把 done 对象存在这个键里，新格式多了 done/ts 一层
      if(s && typeof s === "object" && s.done && typeof s.done === "object"){ state.done = s.done; state.ts = s.ts || 0; }
      else state.done = s;
    }
  }catch(e){}
  function save(){
    state.ts = Date.now();
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
    try {
      fetch("api/state", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ qa: state }) }).catch(function(){});
    } catch(e){}
  }
  function pull(){
    try {
      fetch("api/state", { cache:"no-store" }).then(function(r){ return r.json(); }).then(function(d){
        if(!d || !d.qa) return;
        var q = d.qa;
        if((q.ts || 0) <= (state.ts || 0)) return;
        state.done = q.done || {};
        state.ts = q.ts || 0;
        try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
        render();
      }).catch(function(){});
    } catch(e){}
  }

  var filter = "all";
  var openAll = false;
  var openSet = {};

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function visible(){
    var q = (document.getElementById("search").value || "").trim().toLowerCase();
    return QA.filter(function(x){
      if(filter !== "all" && String(x.c) !== String(filter)) return false;
      if(!q) return true;
      var hay = (x.t + " " + x.q + " " + x.p.join(" ") + " " + (x.tip||"")).toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }

  /* ---------------- 示意图 ---------------- */
  var AX = "#5d6579", CU = "#e0a458", GR = "#5fb47a", BL = "#6aa6e0", TX = "#8a92a6";
  function svg(inner, w, h){
    return '<svg viewBox="0 0 ' + w + ' ' + (h||200) + '" xmlns="http://www.w3.org/2000/svg">' +
      inner + '</svg>';
  }
  function axis(x1,y1,x2,y2){
    return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+AX+'" stroke-width="1.2"/>' +
           '<polygon points="'+x2+','+y2+' '+(x2-5)+','+(y2+3)+' '+(x2-5)+','+(y2-3)+'" fill="'+AX+'"/>' +
           '<polygon points="'+x1+','+y1+' '+(x1-3)+','+(y1+5)+' '+(x1+3)+','+(y1+5)+'" fill="'+AX+'"/>';
  }
  function dot(x,y,label,color,dx,dy){
    return '<circle cx="'+x+'" cy="'+y+'" r="2.6" fill="'+(color||CU)+'"/>' +
      (label?'<text x="'+(x+(dx||6))+'" y="'+(y+(dy||-5))+'" fill="'+(color||CU)+'" font-size="11" font-weight="600">'+label+'</text>':'');
  }
  function txt(x,y,s,color,size,anchor){
    return '<text x="'+x+'" y="'+y+'" fill="'+(color||TX)+'" font-size="'+(size||11)+'"'+
      (anchor?' text-anchor="'+anchor+'"':'')+' font-family="system-ui,sans-serif">'+s+'</text>';
  }

  // 示意图：使用教材原图裁切（img/fig-*.png），点击放大
  var FIG_CAPS = {
    rockSS:"图 岩石全过程应力—应变曲线", creep:"图 岩石典型蠕变曲线",
    rockmass:"图 岩体应力—应变曲线", hole:"图 圆孔在双向等压应力场中的应力分布",
    dist:"图 圆孔周围应力重分布：σr 随 r 增大趋于 σ1",
    abut:"图 采场前方支承压力分区", pdl:"图 支架工作阻力与顶板下沉量（P-ΔL）",
    roadway:"图 区段平巷围岩变形", support:"图 支架—围岩相互作用",
    wilson:"图 威尔逊计算顶板压力的力学模型"
  };

  function figHTML(name){
    var cap = FIG_CAPS[name];
    if(!cap) return "";
    return '<div class="fig"><img src="img/fig-' + name + '.png" alt="' + cap +
      '" loading="lazy" data-zoom="img/fig-' + name + '.png"><div class="cap">' + cap + '</div></div>';
  }

  function render(){
    var list = document.getElementById("list");
    var items = visible();
    if(!items.length){
      list.innerHTML = '<div class="empty">没有匹配的题目</div>';
      return;
    }
    var html = "", lastCh = 0, seq = 0;
    for(var i=0;i<items.length;i++){
      var q = items[i];
      if(q.c !== lastCh){
        lastCh = q.c; seq = 0;
        html += '<h2 class="ch">第 ' + q.c + ' 章 · ' + (CH_NAMES[q.c]||"") + '</h2>';
      }
      seq++;
      var done = !!state.done[q.idx];
      var open = openAll || !!openSet[q.idx];
      html += '<div class="qa' + (open?" open":"") + (done?" done":"") + '" data-i="' + q.idx + '">';
      html += '<div class="qa-head"><div class="qa-idx">' + seq + '</div>';
      html += '<div class="qa-tt">' + esc(q.t) + '</div>';
      html += '<div class="qa-arrow">▸</div></div>';
      html += '<div class="qa-body">';
      html += '<p class="qa-q">' + esc(q.q) + '</p>';
      if(q.f){ var fs = [].concat(q.f); for(var k=0;k<fs.length;k++) html += figHTML(fs[k]); }
      html += '<ol>';
      for(var j=0;j<q.p.length;j++) html += '<li>' + esc(q.p[j]) + '</li>';
      html += '</ol>';
      if(q.tip) html += '<div class="qa-tip"><b>记</b>　' + esc(q.tip) + '</div>';
      html += '<div class="mk" data-mark="' + q.idx + '">' + (done?"✓ 已背过":"标为背过") + '</div>';
      html += '</div></div>';
    }
    list.innerHTML = html;
  }

  function renderProg(){
    var total = QA.length, done = 0;
    for(var i=0;i<QA.length;i++) if(state.done[QA[i].idx]) done++;
    document.getElementById("progFill").style.width = (total? (done/total*100):0) + "%";
    document.getElementById("progTxt").textContent = done + " / " + total;
  }

  var timer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(function(){ el.classList.remove("show"); }, 1600);
  }

  document.addEventListener("click", function(e){
    var zi = e.target.closest("[data-zoom]");
    if(zi){
      document.getElementById("zoomImg").src = zi.dataset.zoom;
      document.getElementById("zoom").classList.add("show");
      return;
    }
    if(e.target.id === "zoom" || (e.target.parentElement && e.target.parentElement.id === "zoom")){
      document.getElementById("zoom").classList.remove("show");
      return;
    }
    var mk = e.target.closest("[data-mark]");
    if(mk){
      var k = mk.dataset.mark;
      if(state.done[k]) delete state.done[k];
      else state.done[k] = 1;
      save(); render(); renderProg();
      toast(state.done[k] ? "记下了" : "取消标记");
      return;
    }
    var head = e.target.closest(".qa-head");
    if(head){
      var box = head.parentElement;
      var idx = box.dataset.i;
      if(openSet[idx]) delete openSet[idx];
      else openSet[idx] = 1;
      box.classList.toggle("open");
      return;
    }
    var chip = e.target.closest("[data-f]");
    if(chip){
      filter = chip.dataset.f;
      var all = document.querySelectorAll("[data-f]");
      for(var i=0;i<all.length;i++) all[i].classList.toggle("on", all[i].dataset.f === filter);
      render();
    }
  });

  document.getElementById("btnOpen").addEventListener("click", function(){
    openAll = !openAll;
    this.classList.toggle("on", openAll);
    this.textContent = openAll ? "全收起" : "全展开";
    render();
  });

  var si = document.getElementById("search");
  si.addEventListener("input", function(){ render(); });

  (function initFilters(){
    var wrap = document.getElementById("filters");
    var html = '<div class="chip on" data-f="all">全部</div>';
    for(var c=1;c<=9;c++) html += '<div class="chip" data-f="' + c + '">第 ' + c + ' 章</div>';
    wrap.innerHTML = html;
  })();

  render();
  renderProg();
  pull();
})();
</script>
</body>
</html>
